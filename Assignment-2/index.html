<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Maker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/normalize.css">

    <!-- JavaScript defer -->
    <script src="js/pizza.js" defer></script>
</head>

<body>

    <header>
        <h1>Welcome to Build Your Pizza, Pizza!</h1>
        <h2>Where you get to Build Your Pizza!</h2>
    </header>
    
    <main>

        <!-- Pizza Order Form -->
        <form id="pizzaForm">

            <!-- CUSTOMER NAME -->
            <label for="customerName">Your Name:</label>
            <input type="text" id="customerName" required>

            <!-- SIZE -->
            <fieldset>
                <legend>Pizza Size</legend>
                <label><input type="radio" name="size" value="small" required> Small</label>
                <label><input type="radio" name="size" value="medium"> Medium</label>
                <label><input type="radio" name="size" value="large"> Large</label>
            </fieldset>

            <!-- CRUST -->
            <label for="crust">Crust Type:</label>
            <select id="crust" required>
                <option value="">-- Choose crust --</option>
                <option value="thin">Thin</option>
                <option value="regular">Regular</option>
                <option value="thick">Thick</option>
                <option value="stuffed">Stuffed Crust</option>
                <option value="pretzel">Pretzel</option>
            </select>

            <!-- SAUCE -->
            <label for="sauce">Sauce:</label>
            <select id="sauce" required>
                <option value="">-- Choose sauce --</option>
                <option value="tomato">Tomato</option>
                <option value="homestyle">Thick Homestyle</option>
                <option value="alfredo">Alfredo</option>
                <option value="pesto">Pesto</option>
            </select>

            <!-- MEAT TOPPINGS -->
            <fieldset>
                <legend>Meat Toppings</legend>
                <label><input type="checkbox" name="toppings" value="pepperoni"> Pepperoni</label>
                <label><input type="checkbox" name="toppings" value="ham"> Ham</label>
                <label><input type="checkbox" name="toppings" value="bacon"> Bacon</label>
                <label><input type="checkbox" name="toppings" value="steak"> Grilled Steak</label>
                <label><input type="checkbox" name="toppings" value="groundBeef"> Ground Beef</label>
                <label><input type="checkbox" name="toppings" value="chicken"> Grilled Chicken</label>
            </fieldset>

            <!-- VEGETABLE TOPPINGS -->
            <fieldset>
                <legend>Vegetable Toppings</legend>
                <label><input type="checkbox" name="toppings" value="pineapple"> Pineapple</label>
                <label><input type="checkbox" name="toppings" value="jalapenos"> Jalapenos</label>
                <label><input type="checkbox" name="toppings" value="onions"> Onions</label>
                <label><input type="checkbox" name="toppings" value="olives"> Black Olives</label>
                <label><input type="checkbox" name="toppings" value="peppers"> Hot Peppers</label>
                <label><input type="checkbox" name="toppings" value="green peppers"> Green Peppers</label>
            </fieldset>

            <!-- EXTRA CHEESE -->
            <label>
                <input type="checkbox" id="extraCheese">
                Extra Cheese
            </label>

            <!-- SPECIAL INSTRUCTIONS -->
            <label for="instructions">Special Instructions:</label>
            <textarea id="instructions" rows="3"></textarea>

            <!-- SUBMIT BUTTON -->
            <button type="submit" id="orderBtn">Order Pizza</button>

            <!-- Add another Pizza-->
             <button type="button" id="addAnotherBtn">Add Another Pizza</button>

        </form>

        <!-- OUTPUT -->
        <section id="output">
            <h3>Your Pizza Order Coming Soon!</h3>
        </section>

    </main>
    <footer>
        <!-- JS inserts name + student ID after page loads -->
        <p id="studentInfo"></p>
    </footer>


</body>
</html>
